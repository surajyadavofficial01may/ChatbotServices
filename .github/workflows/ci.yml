name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Unit tests (offline — no API keys or model downloads)
        run: pytest -q

  retrieval-quality:
    name: Retrieval quality gate (real models)
    # Downloads ~80 MB of models, so it runs on main and on demand rather than every PR push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed_cache  # absolute: Python won't expand "~"
      RUN_MODEL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed_cache
          key: fastembed-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Full suite with real models, incl. benchmark regression gate
        run: pytest -q
