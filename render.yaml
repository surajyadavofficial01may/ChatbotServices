services:
  - type: web
    name: portfolio-chatbot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Portfolio AI Chatbot
      - key: API_PREFIX
        value: /api/v1
      - key: QDRANT_COLLECTION_NAME
        value: portfolio_knowledge
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: SYNC_ENABLED
        value: "true"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
