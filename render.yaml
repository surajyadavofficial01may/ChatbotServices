# Render Blueprint: New -> Blueprint -> select this repository.
# Fill in every variable marked `sync: false` when Render asks for them.
services:
  - type: web
    name: ai-knowledge-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --forwarded-allow-ips: Render's proxy sets X-Forwarded-For; without trusting it,
    # every visitor shares the proxy's IP and the per-IP rate limit becomes global.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_TITLE
        sync: false
      - key: ASSISTANT_PERSONA
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: knowledge_base
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_TABLE_NAME
        value: portfolio_knowledge_base
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
