[project]
name = "ai-knowledge-assistant"
version = "2.0.0"
description = "Plug-and-play RAG chatbot backend: manage knowledge in a password-protected admin studio, sync Supabase to Qdrant Cloud, answer with Groq."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Dependencies are pinned in requirements.txt (runtime) and requirements-dev.txt (tooling),
# which is what Docker, Render, Railway and CI install.

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (PEP 8)
    "F",       # pyflakes
    "I",       # import sorting
    "UP",      # modern Python syntax
    "B",       # bugbear
    "ANN",     # type annotations
    "D",       # docstrings
]
ignore = [
    "ANN401",  # typing.Any is acceptable for third-party objects
    "D105", "D107",  # magic methods / __init__ are documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
